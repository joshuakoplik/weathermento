; La Marzocco Linea Mini companion — M5Stack Core2
[env:m5core2]
platform        = espressif32 @ ^6.11.0
board           = m5stack-core2
framework       = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 1500000
; upload/monitor port: auto-detected. To pin one, add e.g.
;   upload_port = /dev/cu.usbserial-XXXX
board_build.partitions = default_16MB.csv
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
    -DARDUINOJSON_USE_LONG_LONG=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; NimBLE: central role only, one connection (saves RAM next to WiFi + TLS)
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
build_unflags = -std=gnu++11
extra_scripts = pre:tools/version.py
lib_deps =
    m5stack/M5Unified @ ^0.2.7
    bblanchon/ArduinoJson @ ^7.4.2
    links2004/WebSockets @ ^2.6.1
    h2zero/NimBLE-Arduino @ ^2.5.2
